<section class="vote-section">

<div id="discord-user" class="discord-auth-box">
    Проверка Discord...
</div>

<div id="vote-content" class="vote-form" style="display:none;">

    <h2>Голосование</h2>

    <div class="form-group">
        <label>Выберите игру</label>

        <select id="game">
            <option value="">Выберите игру...</option>
            <option>Игра 1</option>
            <option>Игра 2</option>
            <option>Игра 3</option>
        </select>
    </div>


    <div class="form-group">
        <label>Номинация</label>

        <select id="category">
            <option value="">Выберите номинацию...</option>
            <option>Игра года</option>
            <option>Лучший сюжет</option>
            <option>Выбор игроков</option>
        </select>
    </div>


    <div class="form-group">
        <label>Комментарий (необязательно)</label>

        <textarea 
            id="comment"
            placeholder="Почему вы выбрали эту игру?"
        ></textarea>
    </div>


    <button id="sendVote">
        Отдать голос
    </button>


</div>

<script>

let discordUser = null;


// Проверка Discord
fetch("https://auth.creativeawards.fun/me", {
    credentials: "include"
})
.then(r => r.json())
.then(data => {

    const box = document.getElementById("discord-user");
    const vote = document.getElementById("vote-content");


    if (!data.logged) {

        box.innerHTML = `
            <b>🔒 Требуется Discord</b>

            <p>
                Для участия в голосовании необходимо войти через Discord.
            </p>

            <a href="https://auth.creativeawards.fun/login">
                Войти через Discord
            </a>
        `;

        return;
    }


    // сохраняем данные пользователя
    discordUser = data.user;


    box.innerHTML = `
        <span class="discord-success">
            ✅ Discord подключён
        </span>

        <br><br>

        ${discordUser.username}
    `;


    // показываем форму
    vote.style.display = "block";

});




// Отправка голоса
document.getElementById("sendVote").onclick = async () => {


    if (!discordUser) {

        alert("Сначала войдите через Discord");

        return;

    }


    const game =
        document.getElementById("game").value;


    const category =
        document.getElementById("category").value;


    const comment =
        document.getElementById("comment").value;



    if (!game || !category) {

        alert("Выберите игру и номинацию");

        return;

    }



    const response = await fetch(
        "https://auth.creativeawards.fun/submit",
        {
            method: "POST",

            credentials: "include",

            headers: {
                "Content-Type": "application/json"
            },

body: JSON.stringify({
  game,
  category,
  comment
})
        }
    );



const result = await response.json();



    if (result.success) {

        alert("✅ Голос отправлен!");

    } else {

        alert("❌ Ошибка отправки");

    }

};

</script>
