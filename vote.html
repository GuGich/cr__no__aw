<button id="discordLogin">
    Войти через Discord
</button>

<div id="discord-user">
    Проверка Discord...
</div>

<script>
document.getElementById("discordLogin").onclick = () => {
    window.location.href =
        "https://auth.creativeawards.fun/login";
};


fetch("https://auth.creativeawards.fun/me", {
    credentials: "include"
})
.then(r => r.json())
.then(console.log)
.then(data => {

    const box = document.getElementById("discord-user");
    const btn = document.getElementById("discordLogin");

    if (!data.logged) {
        box.innerHTML = "Вы не вошли";
        return;
    }

    btn.style.display = "none";

    box.innerHTML = `
        <b>✅ Discord подключён</b><br>
        ${data.user.username}
    `;
});
</script>
