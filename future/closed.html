<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creative Awards 2026 — Скоро открытие</title>

<meta name="description" content="Creative Awards 2026 — подготовка к новой церемонии. Сайт скоро будет открыт.">

<link rel="icon" type="image/png" href="/favicon.png">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, rgba(255, 215, 80, 0.15), transparent 40%),
        linear-gradient(135deg, #050505, #111);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    position: relative;
    text-align: center;
    padding-bottom: 200px;
    z-index: 2;
}


.logo {
    width: 450px;
    height: 450px;
    object-fit: contain;
    margin-top: 100px;
    padding-top: 100px;

    filter:
        drop-shadow(0 0 20px rgba(255,215,80,.5));

    animation: pulse 3s infinite;
}


@keyframes pulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }

}

.subtitle {
    padding-bottom: 100px;
    margin-bottom: 100px;
    color: #ccc;
    font-size: 20px;
}



.footer {

    position:absolute;

    bottom:20px;

    color:#777;

    font-size:14px;

}

.foot-bottom{ display:flex; justify-content:space-between; align-items:center; padding-top:24px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; gap:10px; }
</style>
</head>
<body>
<div class="container">
    <img class="logo" src="images/wordmark.png" alt="Creative Awards">
    <div class="subtitle">
        Сайт находится в стадии подготовки
    </div>
</div>
<div class="footer">
  <div class="foot-bottom">
    <span>© 2026 Creative Community · Mineland Creative+</span>
    <span>Сайт — неофициальный фан-проект сообщества</span>
  </div>
</div>
</body>
</html>
