<body>

  <main class="generator">

    <section class="panel controls">
      <div class="eyebrow">Creative Awards 2026</div>
      <h1>Генератор карточек</h1>
      <p class="muted">
        Создайте официальную карточку номинанта и скачайте её в PNG.
      </p>

      <label>
        Номинация
        <input id="category" type="text" value="Лучшая игра года">
      </label>

      <label>
        Название игры
        <input id="gameName" type="text" value="Название игры">
      </label>

      <label>
        Автор
        <input id="author" type="text" value="Автор">
      </label>

      <label>
        Дополнительный текст
        <textarea id="description" rows="3">Номинант Creative Awards 2026</textarea>
      </label>

      <label>
        Изображение
        <input id="imageUpload" type="file" accept="image/*">
      </label>

      <div class="actions">
        <button id="downloadBtn" class="btn-primary">
          Скачать PNG
        </button>

        <button id="resetBtn" class="btn-secondary">
          Сбросить
        </button>
      </div>
    </section>


    <section class="preview-panel">
      <div class="preview-title">Предпросмотр</div>

      <div class="canvas-wrap">
        <canvas id="cardCanvas" width="1600" height="900"></canvas>
      </div>
    </section>

  </main>

<style>
  :root {
  --bg: #090909;
  --panel: #111;
  --panel-2: #151515;
  --line: rgba(255,255,255,.09);

  --gold: #c9a45c;
  --gold-hi: #f1d38a;

  --text: #f3f0e9;
  --muted: #99938a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(circle at 80% 20%, rgba(201,164,92,.08), transparent 30%),
    radial-gradient(circle at 20% 80%, rgba(201,164,92,.05), transparent 30%),
    var(--bg);

  color: var(--text);
  font-family: Inter, Arial, sans-serif;
}

.generator {
  width: min(1500px, calc(100% - 40px));
  margin: 40px auto;

  display: grid;
  grid-template-columns: 360px minmax(0, 1fr);
  gap: 30px;
}

.panel,
.preview-panel {
  border: 1px solid var(--line);
  border-radius: 20px;

  background: rgba(17,17,17,.88);
  backdrop-filter: blur(12px);
}

.controls {
  padding: 28px;
}

.eyebrow {
  color: var(--gold);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}

h1 {
  margin: 10px 0 10px;
  font-size: 32px;
}

.muted {
  margin: 0 0 30px;
  color: var(--muted);
  line-height: 1.6;
}

label {
  display: block;
  margin-bottom: 18px;

  color: #cfcac1;
  font-size: 13px;
}

input,
textarea {
  width: 100%;
  margin-top: 8px;

  padding: 13px 14px;

  border: 1px solid var(--line);
  border-radius: 10px;

  outline: none;

  background: #0d0d0d;
  color: #fff;

  font: inherit;

  transition: .2s ease;
}

input:focus,
textarea:focus {
  border-color: rgba(201,164,92,.6);
  box-shadow: 0 0 0 3px rgba(201,164,92,.08);
}

textarea {
  resize: vertical;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

button {
  flex: 1;

  padding: 13px 16px;

  border-radius: 10px;
  border: 1px solid transparent;

  font-weight: 700;
  cursor: pointer;

  transition: .2s ease;
}

.btn-primary {
  background: linear-gradient(
    135deg,
    #d8b76d,
    #a98238
  );

  color: #0b0b0b;
}

.btn-primary:hover {
  transform: translateY(-1px);
  filter: brightness(1.08);
}

.btn-secondary {
  border-color: var(--line);
  background: #161616;
  color: #d8d3ca;
}

.btn-secondary:hover {
  background: #1d1d1d;
}

.preview-panel {
  padding: 25px;
}

.preview-title {
  margin-bottom: 15px;

  color: var(--muted);

  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.canvas-wrap {
  width: 100%;
  overflow: auto;

  border-radius: 14px;
  background: #050505;
  padding: 10px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;

  border-radius: 10px;
}

@media (max-width: 900px) {

  .generator {
    grid-template-columns: 1fr;
  }

}

<script>
  const canvas = document.getElementById("cardCanvas");
const ctx = canvas.getContext("2d");

const categoryInput = document.getElementById("category");
const gameInput = document.getElementById("gameName");
const authorInput = document.getElementById("author");
const descriptionInput = document.getElementById("description");
const imageUpload = document.getElementById("imageUpload");

const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");

let uploadedImage = null;


/* =========================
   HELPERS
========================= */

function roundedRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();

  ctx.moveTo(x + radius, y);

  ctx.arcTo(
    x + width,
    y,
    x + width,
    y + height,
    radius
  );

  ctx.arcTo(
    x + width,
    y + height,
    x,
    y + height,
    radius
  );

  ctx.arcTo(
    x,
    y + height,
    x,
    y,
    radius
  );

  ctx.arcTo(
    x,
    y,
    x + width,
    y,
    radius
  );

  ctx.closePath();
}


function drawText(
  text,
  x,
  y,
  maxWidth,
  lineHeight
) {
  const words = text.split(" ");
  let line = "";
  let currentY = y;

  for (let i = 0; i < words.length; i++) {

    const testLine =
      line.length
        ? `${line} ${words[i]}`
        : words[i];

    const width =
      ctx.measureText(testLine).width;

    if (width > maxWidth && line.length) {

      ctx.fillText(
        line,
        x,
        currentY
      );

      line = words[i];
      currentY += lineHeight;

    } else {
      line = testLine;
    }
  }

  if (line) {
    ctx.fillText(
      line,
      x,
      currentY
    );
  }
}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      canvas.width,
      canvas.height
    );

  gradient.addColorStop(
    0,
    "#080808"
  );

  gradient.addColorStop(
    0.5,
    "#11100e"
  );

  gradient.addColorStop(
    1,
    "#050505"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* gold glow */

  const glow =
    ctx.createRadialGradient(
      1300,
      100,
      0,
      1300,
      100,
      700
    );

  glow.addColorStop(
    0,
    "rgba(201,164,92,.20)"
  );

  glow.addColorStop(
    1,
    "rgba(201,164,92,0)"
  );

  ctx.fillStyle = glow;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* diagonal light */

  const beam =
    ctx.createLinearGradient(
      0,
      0,
      canvas.width,
      canvas.height
    );

  beam.addColorStop(
    0,
    "rgba(255,255,255,0)"
  );

  beam.addColorStop(
    0.5,
    "rgba(255,255,255,.035)"
  );

  beam.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.save();

  ctx.rotate(-0.15);

  ctx.fillStyle = beam;

  ctx.fillRect(
    -300,
    250,
    2100,
    130
  );

  ctx.restore();
}


/* =========================
   IMAGE
========================= */

function drawImage() {

  if (!uploadedImage) {

    ctx.fillStyle = "#141414";

    roundedRect(
      ctx,
      890,
      110,
      590,
      680,
      20
    );

    ctx.fill();

    ctx.fillStyle = "#625e56";

    ctx.font =
      "700 22px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
      "ИЗОБРАЖЕНИЕ ИГРЫ",
      1185,
      435
    );

    ctx.font =
      "16px Arial";

    ctx.fillStyle = "#817b72";

    ctx.fillText(
      "Загрузите изображение слева",
      1185,
      470
    );

    ctx.textAlign = "left";

    return;
  }


  const x = 890;
  const y = 110;
  const width = 590;
  const height = 680;

  ctx.save();

  roundedRect(
    ctx,
    x,
    y,
    width,
    height,
    20
  );

  ctx.clip();


  const imageRatio =
    uploadedImage.width /
    uploadedImage.height;

  const containerRatio =
    width / height;

  let drawWidth;
  let drawHeight;
  let drawX;
  let drawY;

  if (imageRatio > containerRatio) {

    drawHeight = height;

    drawWidth =
      height * imageRatio;

    drawX =
      x + (width - drawWidth) / 2;

    drawY = y;

  } else {

    drawWidth = width;

    drawHeight =
      width / imageRatio;

    drawX = x;

    drawY =
      y + (height - drawHeight) / 2;
  }

  ctx.drawImage(
    uploadedImage,
    drawX,
    drawY,
    drawWidth,
    drawHeight
  );


  /* image darkening */

  const imageOverlay =
    ctx.createLinearGradient(
      0,
      y,
      0,
      y + height
    );

  imageOverlay.addColorStop(
    0,
    "rgba(0,0,0,.05)"
  );

  imageOverlay.addColorStop(
    .65,
    "rgba(0,0,0,.12)"
  );

  imageOverlay.addColorStop(
    1,
    "rgba(0,0,0,.72)"
  );

  ctx.fillStyle =
    imageOverlay;

  ctx.fillRect(
    x,
    y,
    width,
    height
  );

  ctx.restore();


  /* image border */

  ctx.strokeStyle =
    "rgba(201,164,92,.45)";

  ctx.lineWidth = 2;

  roundedRect(
    ctx,
    x,
    y,
    width,
    height,
    20
  );

  ctx.stroke();
}


/* =========================
   CONTENT
========================= */

function drawContent() {

  const leftX = 100;


  /* logo */

  ctx.fillStyle =
    "#d7b66d";

  ctx.font =
    "700 18px Arial";

  ctx.letterSpacing = "3px";

  ctx.fillText(
    "CREATIVE AWARDS",
    leftX,
    95
  );


  /* category */

  ctx.fillStyle =
    "#b4975a";

  ctx.font =
    "700 17px Arial";

  ctx.fillText(
    categoryInput.value.toUpperCase(),
    leftX,
    180
  );


  /* separator */

  ctx.fillStyle =
    "#c9a45c";

  ctx.fillRect(
    leftX,
    205,
    65,
    3
  );


  /* game name */

  ctx.fillStyle =
    "#f5f2eb";

  ctx.font =
    "700 72px Arial";

  const gameName =
    gameInput.value || "Название игры";

  drawText(
    gameName,
    leftX,
    310,
    680,
    82
  );


  /* author */

  ctx.fillStyle =
    "#b0aaa0";

  ctx.font =
    "18px Arial";

  ctx.fillText(
    `Автор: ${authorInput.value}`,
    leftX,
    490
  );


  /* description */

  ctx.fillStyle =
    "#8c887f";

  ctx.font =
    "18px Arial";

  drawText(
    descriptionInput.value,
    leftX,
    550,
    630,
    30
  );


  /* nominee */

  ctx.fillStyle =
    "#f1d38a";

  ctx.font =
    "700 15px Arial";

  ctx.fillText(
    "НОМИНАНТ",
    leftX,
    735
  );


  /* year */

  ctx.fillStyle =
    "#6e6960";

  ctx.font =
    "700 13px Arial";

  ctx.fillText(
    "2026",
    leftX,
    770
  );
}


/* =========================
   BORDER
========================= */

function drawBorder() {

  ctx.strokeStyle =
    "rgba(201,164,92,.35)";

  ctx.lineWidth = 2;

  ctx.strokeRect(
    20,
    20,
    canvas.width - 40,
    canvas.height - 40
  );
}


/* =========================
   GENERATE
========================= */

function render() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground();
  drawImage();
  drawContent();
  drawBorder();
}


/* =========================
   INPUT EVENTS
========================= */

[
  categoryInput,
  gameInput,
  authorInput,
  descriptionInput
].forEach(input => {

  input.addEventListener(
    "input",
    render
  );

});


imageUpload.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }

    const reader =
      new FileReader();

    reader.onload = () => {

      const image =
        new Image();

      image.onload = () => {

        uploadedImage = image;

        render();
      };

      image.src =
        reader.result;
    };

    reader.readAsDataURL(file);
  }
);


/* =========================
   DOWNLOAD
========================= */

downloadBtn.addEventListener(
  "click",
  () => {

    const link =
      document.createElement("a");

    const safeName =
      (
        gameInput.value
        || "nominee"
      )
      .trim()
      .replace(
        /[^a-zA-Zа-яА-Я0-9_-]+/g,
        "_"
      );

    link.download =
      `CreativeAwards_2026_${safeName}.png`;

    link.href =
      canvas.toDataURL(
        "image/png"
      );

    link.click();
  }
);


/* =========================
   RESET
========================= */

resetBtn.addEventListener(
  "click",
  () => {

    categoryInput.value =
      "Лучшая игра года";

    gameInput.value =
      "Название игры";

    authorInput.value =
      "Автор";

    descriptionInput.value =
      "Номинант Creative Awards 2026";

    imageUpload.value = "";

    uploadedImage = null;

    render();
  }
);


/* first render */

render();
</script>

</body>
